name: Bug report
description: Report something in {{name}} that doesn't work as expected.
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For questions or help setting up the plugin, please use the [support forum](https://wordpress.org/support/plugin/{{slug}}/) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps, settings, and URLs involved help a lot.
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: {{name}} version
      placeholder: '1.0.0'
    validations:
      required: true
  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
      placeholder: '7.1.3'
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: '8.3'
    validations:
      required: true
  - type: dropdown
    id: multilingual
    attributes:
      label: Multilingual plugin
      options:
        - No multilingual plugin
        - WPML
        - Polylang
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Other plugins and theme
      description: List the active theme and plugins, especially ones related to the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the problem still happens with the latest version of {{name}}.
          required: true
        - label: This isn't a security vulnerability. Those are reported privately; see SECURITY.md.
          required: true
